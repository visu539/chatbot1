name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run migrations
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test
          DJANGO_DEBUG: true
        run: |
          python backend/manage.py migrate --noinput
      - name: Lint
        run: python -m py_compile $(git ls-files 'backend/**/*.py')
      - name: Seed and smoke runserver check
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test
          DJANGO_DEBUG: true
        run: |
          python backend/manage.py seed_demo_data
          python - <<'PY'
          import sys
          print('Backend ready')
          PY